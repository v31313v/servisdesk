{% extends 'base.html' %}

{% block title %}Удаление заявки #{{ ticket.pk }} — НЕВЕКС{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Удаление заявки</h5>
            </div>
            <div class="card-body">
                <p>Вы действительно хотите удалить заявку?</p>
                <div class="alert alert-secondary">
                    <strong>#{{ ticket.pk }}</strong> — {{ ticket.subject }}
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{{ ticket.get_absolute_url }}" class="btn btn-secondary">Отмена</a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Удалить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
